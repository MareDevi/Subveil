[workspace]
members = ["crates/subveil", "crates/subveil-core", "crates/subveil-audio", "crates/subveil-asr"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
anyhow = "1.0"
gpui-kit = "=0.8.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
subveil-core = { path = "crates/subveil-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 1
