# Copy beside an unpacked sherpa-onnx streaming transducer model.
# Replace every path and hash with values from your own model package.
# Offline Whisper/Paraformer packages are not compatible with this backend.
kind = "streaming_transducer"
languages = ["en"]
language = "en"
sample_rate = 16000
source = "https://github.com/k2-fsa/sherpa-onnx/releases/tag/asr-models"
license = "Replace with the actual model license; do not assume the runtime license applies"

[encoder]
path = "encoder.onnx"
sha256 = "REPLACE_WITH_64_HEX_DIGITS"
[decoder]
path = "decoder.onnx"
sha256 = "REPLACE_WITH_64_HEX_DIGITS"
[joiner]
path = "joiner.onnx"
sha256 = "REPLACE_WITH_64_HEX_DIGITS"
[tokens]
path = "tokens.txt"
sha256 = "REPLACE_WITH_64_HEX_DIGITS"
