[package]
name = "subveil-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
sha2 = "0.10"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
