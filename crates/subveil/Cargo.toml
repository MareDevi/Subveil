[package]
name = "subveil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
subveil-core.workspace = true
subveil-asr = { path = "../subveil-asr" }
subveil-audio = { path = "../subveil-audio" }

subveil-translate = { path = "../subveil-translate" }
serde.workspace = true
toml.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"
ksni = { version = "=0.3.7", default-features = false, features = ["async-io"] }

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
sherpa-onnx = "=1.13.8"
