[tools]
rust = { version = "1.99.1", components = ["rust-analyzer", "rust-src", "clippy", "rustfmt"] }

[tasks.doctor]
description = "Check Rust and Linux native development dependencies"
run = "bash scripts/doctor.sh"

[tasks.build]
description = "Build the native application"
run = "cargo build --workspace --locked"

[tasks.run]
depends = ["build"]
description = "Launch the native subtitle control window"
run = "cargo run --locked -p subveil"

[tasks.demo]
depends = ["build"]
description = "Launch an offline mock subtitle overlay"
run = "cargo run --locked -p subveil -- --demo"

[tasks."audio:probe"]
description = "Validate local PipeWire capture: optional seconds and sample rate"
run = "cargo run --locked -p subveil-audio --example probe --"

[tasks."audio:isolation"]
description = "Verify two synthetic playback streams remain isolated, with no recording or upload"
run = "timeout 90s cargo run --locked -p subveil-audio --example isolation_probe"

[tasks."asr:probe"]
description = "Explicit ASR diagnostic; cloud requires --allow-upload"
run = "timeout 90s cargo run --locked -p subveil-asr --example asr_probe --"

[tasks."asr:check"]
description = "Build, lint and test every ASR target"
run = ["cargo build --workspace --all-features --locked", "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings", "timeout 90s cargo test --workspace --all-features --locked"]

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint every workspace target without warnings"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run workspace tests"
run = "timeout 90s cargo test --workspace --locked"

[tasks.check]
description = "Run all quality gates sequentially"
run = ["mise run fmt:check", "mise run build", "mise run clippy", "mise run test"]

[tasks."asr:local-wav"]
description = "Validate an explicitly imported streaming model against a local WAV"
run = "timeout 90s cargo run --locked -p subveil-asr --example local_wav_probe --"

[tasks."asr:quality"]
description = "Compare an explicit local public WAV with a reference; print metrics only"
run = "timeout 90s cargo run --locked -p subveil-asr --example quality_probe --"

[tasks."model:install"]
description = "Explicitly install a curated model using the application's verified downloader"
run = "timeout 90s cargo run --locked -p subveil-asr --example model_install --"

[tasks.models]
depends = ["build"]
description = "Open the native local model library without capture or download"
run = "cargo run --locked -p subveil -- --models"

[tasks."translate:probe"]
depends = ["build"]
description = "Offline native CPU/GPU translation with public English/Japanese fixtures"
run = "timeout 90s cargo run --locked -p subveil-translate --example local_probe --"

[tasks."offline:probe"]
depends = ["build"]
description = "Local WAV or explicit PipeWire playback through ASR, translation and subtitle state"
run = "timeout 90s cargo run --locked -p subveil --example offline_pipeline --"

[tasks."doctor:cuda"]
depends = ["doctor"]
description = "Check optional NVIDIA CUDA compiler and driver without modifying the system"
run = ["nvcc --version", "nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv"]

[tasks."build:cuda"]
description = "Build native application and isolated Whisper CUDA backend (requires CUDA toolkit)"
depends = ["build"]
run = ["bash scripts/cuda.sh build --target-dir target/cuda --locked -p subveil-whisper --features cuda", "install -m755 target/cuda/debug/subveil-whisper target/debug/subveil-whisper-cuda"]

[tasks."check:cuda"]
description = "Run all quality gates including the optional CUDA backend"
run = ["mise run fmt:check", "mise run build:cuda", "bash scripts/cuda.sh clippy --target-dir target/cuda -p subveil-whisper --all-targets --locked --features cuda -- -D warnings", "timeout 90s bash scripts/cuda.sh test --target-dir target/cuda -p subveil-whisper --locked --features cuda", "mise run check"]

[tasks."models:cuda"]
depends = ["build:cuda"]
description = "Open native model library with the CUDA Whisper helper"
run = "cargo run --locked -p subveil -- --models"

[tasks."whisper:bench"]
description = "Benchmark the already-built Whisper helper on an explicit public WAV, without printing text"
run = "timeout 90s cargo run --locked -p subveil-asr --example whisper_bench --"

[tasks."offline:probe:cuda"]
depends = ["build:cuda"]
description = "Verify offline subtitles with explicit Whisper CUDA and CPU/Vulkan translation choices"
run = "timeout 90s cargo run --locked -p subveil --example offline_pipeline --"

[tasks."run:cuda"]
depends = ["build:cuda"]
description = "Launch the native application with the optional Whisper CUDA backend"
run = "cargo run --locked -p subveil"

[tasks."build:whisper:release"]
description = "Build optimized Whisper CUDA helper and benchmark (CUDA toolkit required)"
run = ["bash scripts/cuda.sh build --release --target-dir target/cuda --locked -p subveil-whisper --features cuda", "cargo build --release --locked -p subveil-whisper", "cargo build --release --locked -p subveil-asr --example whisper_bench", "install -m755 target/cuda/release/subveil-whisper target/release/subveil-whisper-cuda"]

[tasks."whisper:bench:release"]
depends = ["build:whisper:release"]
description = "Measure optimized Whisper CUDA/CPU inference on an explicit WAV without printing text"
run = "timeout 90s cargo run --release --locked -p subveil-asr --example whisper_bench --"

[tasks."package:cpu"]
description = "Build and verify a local Linux installation archive; never publish"
run = ["cargo build --release --workspace --locked", "python scripts/package.py"]

[tasks."package:cuda"]
description = "Build a Linux archive containing distinct CPU and CUDA Whisper helpers"
depends = ["package:cpu"]
run = ["bash scripts/cuda.sh build --release --target-dir target/cuda --locked -p subveil-whisper --features cuda", "install -m755 target/cuda/release/subveil-whisper target/release/subveil-whisper-cuda", "python scripts/package.py --cuda"]

[tasks."package:debug"]
description = "Verify packaging and installation layout with existing debug binaries"
depends = ["build"]
run = "python scripts/package.py --profile debug"

[tasks."package:smoke"]
description = "Check a fresh private install prefix and reject missing/mismatched helpers"
run = "timeout 90s python scripts/package_smoke.py"
