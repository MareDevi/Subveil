[tools]
rust = { version = "1.99.1", components = ["rustfmt", "clippy"] }

[tasks.doctor]
description = "Check Rust and Linux native development dependencies"
run = "bash scripts/doctor.sh"

[tasks.build]
description = "Build the native application"
run = "cargo build --workspace --locked"

[tasks.run]
description = "Launch the native subtitle control window"
run = "cargo run --locked -p subveil"

[tasks.demo]
description = "Launch an offline mock subtitle overlay"
run = "cargo run --locked -p subveil -- --demo"

[tasks."audio:probe"]
description = "Validate local PipeWire capture: optional seconds and sample rate"
run = "cargo run --locked -p subveil-audio --example probe --"

[tasks."asr:probe"]
description = "Explicit ASR diagnostic; cloud requires --allow-upload"
run = "timeout 90s cargo run --locked -p subveil-asr --example asr_probe --"

[tasks."asr:check"]
description = "Build, lint and test the optional local sherpa backend"
run = ["cargo build --workspace --all-features --locked", "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings", "timeout 90s cargo test --workspace --all-features --locked"]

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint every workspace target without warnings"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run workspace tests"
run = "timeout 90s cargo test --workspace --locked"

[tasks.check]
description = "Run all quality gates sequentially"
run = ["mise run fmt:check", "mise run build", "mise run clippy", "mise run test"]
